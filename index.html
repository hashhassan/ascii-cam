<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASCII Camera</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>ASCII<span>CAM</span></h1>
      <p class="subtitle">real-time ascii art camera</p>
    </div>

    <div class="main">

      <div class="display-wrapper">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <video id="video" autoplay playsinline></video>
        <pre id="ascii-output"><span class="placeholder">[ camera off ]</span></pre>

        <!-- Flash overlay for capture effect -->
        <div class="flash-overlay" id="flashOverlay"></div>
      </div>

      <div class="sidebar">

        <div class="card">
          <div class="card-title">CAMERA</div>
          <button id="startBtn">Start Camera</button>

          <!-- Flip button: only relevant on mobile, hidden on desktop via CSS -->
          <button id="flipBtn" class="flip-btn" disabled title="Flip Camera">
            ⟳ Flip Camera
          </button>

          <!-- Capture button -->
          <button id="captureBtn" class="capture-btn" disabled>
            ◉ Capture
          </button>
        </div>

        <div class="card">
          <div class="card-title">THEME</div>
          <div class="theme-buttons">
            <button class="theme-btn active" data-color="#00ff99">Green</button>
            <button class="theme-btn" data-color="#00cfff">Cyan</button>
            <button class="theme-btn" data-color="#ff4fd8">Pink</button>
            <button class="theme-btn" data-color="#ffffff">White</button>
            <button class="theme-btn" data-color="#ffaa00">Amber</button>
            <button class="theme-btn" data-color="#8a2be2">Purple</button>
            <button class="theme-btn" data-color="#ff0033">Red</button>
            <button class="theme-btn" data-color="#32ff00">Lime</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">ADJUSTMENTS</div>

          <div class="slider-group">
            <div class="slider-label">
              <span>Contrast</span>
              <span id="contrastVal">1</span>
            </div>
            <input type="range" id="contrast" min="0.5" max="3" step="0.1" value="1" />
          </div>

          <div class="slider-group">
            <div class="slider-label">
              <span>Brightness</span>
              <span id="brightnessVal">0</span>
            </div>
            <input type="range" id="brightness" min="-100" max="100" step="1" value="0" />
          </div>

          <div class="slider-group">
            <div class="slider-label">
              <span>Density</span>
              <span id="densityVal">10</span>
            </div>
            <input type="range" id="density" min="1" max="10" step="1" value="10" />
          </div>

        </div>

        <div class="card">
          <div class="card-title">CHARACTER SET</div>
          <div class="charset-buttons">
            <button class="charset-btn active" data-chars=" .:-=+*#%@">Standard</button>
            <button class="charset-btn" data-chars=" .:!|/\(){}">Symbols</button>
            <div class="mobile-hidden">
              <button class="charset-btn" data-chars=" ░▒▓█">Blocks</button>
              <button class="charset-btn" data-chars=" ·∙•◦○●">Dots</button>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Hidden canvas used for PNG export -->
  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script src="js/ascii.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/capture.js"></script>
</body>
</html>
